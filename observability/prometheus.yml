global:
  scrape_interval: 5s

scrape_configs:
  - job_name: api
    static_configs:
      - targets: ["api:8000"]
  # Workers scale dynamically; use Docker DNS service discovery so every replica is scraped.
  - job_name: worker
    dns_sd_configs:
      - names: ["worker"]
        type: A
        port: 9100
  - job_name: stub-llm
    static_configs:
      - targets: ["stub-llm:8080"]
