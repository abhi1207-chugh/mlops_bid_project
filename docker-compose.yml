# Deployment boundaries (justify these in the report):
#  api      - latency-sensitive, stateless, scaled by request rate; must stay up while workers are busy or failing
#  worker   - CPU/LLM-bound, slow runs; scaled independently (--scale worker=3); failure must not take down the API
#  redis    - queue, cache and rate-limit state shared by api and workers
#  stub-llm - isolates load tests from provider rate limits
#  prometheus / grafana / jaeger - observability, released independently of the app

services:
  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  stub-llm:
    build: ./services/stub_llm
    environment:
      STUB_DELAY_MS: ${STUB_DELAY_MS:-1500}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8080/health')"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build:
      context: .
      dockerfile: services/api/Dockerfile
    env_file: .env
    environment:
      # A benchmark may raise this through Compose without weakening the normal .env default.
      RATE_LIMIT_PER_MINUTE: ${RATE_LIMIT_PER_MINUTE:-10}
    ports:
      - "${API_PORT:-8000}:8000"
    volumes:
      - appdata:/data
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 3s
      retries: 10

  worker:
    build:
      context: .
      dockerfile: services/worker/Dockerfile
    env_file: .env
    environment:
      # Explicit values allow Phase 3's local-stub measurements to override .env.
      LLM_PROVIDER: ${LLM_PROVIDER:-stub}
      LLM_BASE_URL: ${LLM_BASE_URL:-http://stub-llm:8080}
      PROMPT_VERSION: ${PROMPT_VERSION:-v1}
      # The embedding model is baked into the worker image; runtime screening must
      # not depend on an external model hub or an API token.
      HF_HUB_OFFLINE: "1"
      TRANSFORMERS_OFFLINE: "1"
    volumes:
      - appdata:/data
      - ./artifacts:/artifacts
    depends_on:
      redis:
        condition: service_healthy
      stub-llm:
        condition: service_healthy
    # Do not set container_name or host ports here: this service must scale with --scale worker=3
    expose:
      - "9100"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:9100/ready')"]
      interval: 10s
      timeout: 3s
      retries: 12

  prometheus:
    image: prom/prometheus:latest
    volumes:
      - ./observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "9090:9090"
    depends_on:
      - api
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://localhost:9090/-/healthy"]
      interval: 10s
      timeout: 3s
      retries: 10

  grafana:
    image: grafana/grafana:latest
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?set GRAFANA_ADMIN_PASSWORD in .env}
    volumes:
      - ./observability/grafana-dashboard.json:/var/lib/grafana/dashboards/bid-compliance.json:ro
      - ./observability/grafana-provisioning.yaml:/etc/grafana/provisioning/dashboards/bid-compliance.yaml:ro
    ports:
      - "${GRAFANA_PORT:-3002}:3000"
    depends_on:
      - prometheus
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://localhost:3000/api/health"]
      interval: 10s
      timeout: 3s
      retries: 10

  jaeger:
    image: jaegertracing/all-in-one:latest
    environment:
      COLLECTOR_OTLP_ENABLED: "true"
    ports:
      - "16686:16686"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://localhost:16686/"]
      interval: 10s
      timeout: 3s
      retries: 10

volumes:
  appdata:
  redisdata:
